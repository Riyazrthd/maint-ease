<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MaintEase Pro - Machine Maintenance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.400.0/dist/umd/lucide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/dist/html5-qrcode.min.js"></script>
    <link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .modal-bg { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #print-template { display: none; }
        @media print {
            body * { visibility: hidden; }
            #print-template, #print-template * { visibility: visible; }
            #print-template { display: block !important; position: absolute; left: 0; top: 0; width: 100%; font-family: 'Arial', sans-serif; color: black; background: white; }
            @page { size: landscape; margin: 0.5cm; }
            .no-print { display: none !important; }
        }
        .pr-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .pr-table th, .pr-table td { border: 1px solid black; padding: 6px; text-align: center; font-size: 10px; vertical-align: middle; }
        .pr-header { text-align: center; border: 1px solid black; padding: 10px; margin-bottom: -1px; position: relative; }
    </style>

    <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const SUPABASE_URL = 'https://duikfskqbacackelieux.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_YpdpFwDc3uQY27mK_yghYQ_LLiv7IQe';
    window.SupabaseClient = null;
    try {
        window.SupabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (err) {
        console.error('Supabase init error:', err);
    }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col text-sm">

    <!-- Desktop Sidebar (hidden on mobile) -->
    <aside class="w-64 bg-slate-900 text-slate-400 hidden lg:flex flex-col flex-shrink-0 fixed h-full no-print z-10">
        <div class="p-6 flex items-center space-x-3 text-white border-b border-slate-800/50">
            <div class="bg-blue-600 p-2 rounded-lg shadow-lg shadow-blue-500/20"><i data-lucide="settings" class="w-5 h-5"></i></div>
            <span class="font-bold tracking-tight text-lg">MaintEase Pro</span>
        </div>
        <nav class="flex-1 px-4 py-4 space-y-1">
            <button onclick="switchView('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition-all bg-slate-800 text-white">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>Dashboard</span>
            </button>
            <button onclick="switchView('machines')" id="nav-machines" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition-all hover:bg-slate-800/50">
                <i data-lucide="hard-drive" class="w-4 h-4"></i><span>Machine List</span>
            </button>
            <button onclick="switchView('repairs')" id="nav-repairs" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition-all hover:bg-slate-800/50">
                <i data-lucide="wrench" class="w-4 h-4"></i><span>Repair Logs</span>
            </button>
            <button onclick="switchView('amc')" id="nav-amc" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition-all hover:bg-slate-800/50">
                <i data-lucide="clipboard-list" class="w-4 h-4"></i><span>AMC Tracking</span>
            </button>
            <div class="pt-8 pb-2 px-4 text-[10px] font-bold text-slate-600 uppercase tracking-[0.2em]">Asset Archives</div>
            <button onclick="switchView('scrap')" id="nav-scrap" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition-all hover:bg-slate-800/50">
                <i data-lucide="archive" class="w-4 h-4"></i><span>Scrap History</span>
            </button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden no-print lg:ml-64 pb-16 lg:pb-0">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 md:px-8 flex-shrink-0">
            <div id="breadcrumb" class="flex items-center space-x-2 text-slate-500 text-[10px] uppercase font-bold tracking-widest">
                <span>SYSTEM</span><i data-lucide="chevron-right" class="w-3 h-3"></i><span id="current-view-title" class="text-slate-900 uppercase">DASHBOARD</span>
            </div>
            <div class="flex items-center space-x-4">
                 <div class="relative cursor-pointer hover:bg-slate-50 p-2 rounded-full transition-colors"><i data-lucide="bell" class="w-4 h-4 text-slate-600"></i><span id="amc-alert-dot" class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-600 rounded-full border-2 border-white hidden"></span></div>
            </div>
        </header>
        <div id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8 bg-[#F8FAFC] custom-scrollbar"></div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around items-center py-2 px-2 z-50 lg:hidden no-print shadow-lg">
        <button onclick="switchView('dashboard')" class="flex flex-col items-center text-slate-500 transition-colors bottom-nav-btn" id="mobile-nav-dashboard"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="text-[9px] font-bold mt-0.5">Home</span></button>
        <button onclick="switchView('machines')" class="flex flex-col items-center text-slate-500 transition-colors bottom-nav-btn" id="mobile-nav-machines"><i data-lucide="hard-drive" class="w-5 h-5"></i><span class="text-[9px] font-bold mt-0.5">Machines</span></button>
        <button onclick="switchView('repairs')" class="flex flex-col items-center text-slate-500 transition-colors bottom-nav-btn" id="mobile-nav-repairs"><i data-lucide="wrench" class="w-5 h-5"></i><span class="text-[9px] font-bold mt-0.5">Repairs</span></button>
        <button onclick="switchView('amc')" class="flex flex-col items-center text-slate-500 transition-colors bottom-nav-btn" id="mobile-nav-amc"><i data-lucide="clipboard-list" class="w-5 h-5"></i><span class="text-[9px] font-bold mt-0.5">AMC</span></button>
        <button onclick="switchView('scrap')" class="flex flex-col items-center text-slate-500 transition-colors bottom-nav-btn" id="mobile-nav-scrap"><i data-lucide="archive" class="w-5 h-5"></i><span class="text-[9px] font-bold mt-0.5">Scrap</span></button>
    </div>

    <div id="modal-container" class="fixed inset-0 modal-bg z-50 flex items-center justify-center p-4 hidden no-print"></div>
    <div id="print-template"></div>

    <script>
        // --- Application State ---
        let state = {
            currentView: 'dashboard',
            activeAuditId: null,
            lifeDisplayMode: 'months',
            amcAlertDays: 20,
            machines: [],
            repairs: [],
            amcJobs: []
        };
        let repairScanner = null;  // for QR scanner

        // --- Core Helpers ---
        function getMachine(id) { return state.machines.find(m => m.id === id); }
        function getRepair(id) { return state.repairs.find(r => r.id === id); }
        function isAmcExpired(date) { return date && new Date(date) < new Date(); }
        function isAmcSoon(date) {
            if (!date) return false;
            const diff = (new Date(date) - new Date()) / (1000 * 60 * 60 * 24);
            return diff <= state.amcAlertDays && diff > 0;
        }

        // --- Supabase Sync Helpers (unchanged) ---
        function getSb() { return window.SupabaseClient || null; }
        function throwIfSbError(res, context) {
            if (res && res.error) throw new Error(`${context}: ${res.error.message || 'Unknown Supabase error'}`);
            return res ? res.data : null;
        }
        function notifySbError(context, err) {
            console.error(context, err);
            alert(`${context}\n${err && err.message ? err.message : err}`);
        }

        function machineToPayload(m) {
            return {
                id: m.id,
                name: m.name,
                make: m.make || '',
                model: m.model || '',
                sr_no: m.srNo || '',
                oem_sr_no: m.oemSrNo || '',
                issue_date: m.issueDate || null,
                custodian: m.custodian || '',
                status: m.status || 'Active',
                life_years: m.lifeYears || null,
                amc_expiry: m.amcExpiry || null,
                next_amc_date: m.nextAmcDate || null,
                scrap_date: m.scrapDate || null,
                scrap_reason: m.scrapReason || null,
                approved_by: m.approvedBy || null
            };
        }

        function payloadToMachine(r) {
            return {
                id: r.id,
                name: r.name,
                make: r.make || '',
                model: r.model || '',
                srNo: r.sr_no || '',
                oemSrNo: r.oem_sr_no || '',
                issueDate: r.issue_date || '',
                custodian: r.custodian || '',
                status: r.status || 'Active',
                lifeYears: r.life_years || undefined,
                amcExpiry: r.amc_expiry || '',
                nextAmcDate: r.next_amc_date || '',
                scrapDate: r.scrap_date || '',
                scrapReason: r.scrap_reason || '',
                approvedBy: r.approved_by || ''
            };
        }

        function repairToPayload(r) {
            return {
                id: r.id,
                machine_id: r.machineId,
                repair_type: r.repairType,
                problem: r.problem,
                initiator_name: r.initiatorName || '',
                prob_report_by: r.probReportBy || '',
                checked_by: r.checkedBy || '',
                sr_no_auto: r.srNoAuto || '',
                oem_auto: r.oemAuto || '',
                make_auto: r.makeAuto || '',
                custodian_auto: r.custodianAuto || '',
                qty: r.qty || 1,
                unit: r.unit || 'Nos',
                rate: r.rate || 0,
                amount: r.amount || 0,
                require_date: r.requireDate || null,
                sent_to_store: r.sentToStore || null,
                status: r.status || 'In Workshop',
                remarks: r.remarks || '',
                actual_problem: r.actualProblem || null,
                parts_replaced: r.partsReplaced || null,
                received_date: r.receivedDate || null,
                last_edited: r.lastEdited || null
            };
        }

        function payloadToRepair(r) {
            return {
                id: r.id,
                machineId: r.machine_id,
                repairType: r.repair_type,
                problem: r.problem,
                initiatorName: r.initiator_name || '',
                probReportBy: r.prob_report_by || '',
                checkedBy: r.checked_by || '',
                srNoAuto: r.sr_no_auto || '',
                oemAuto: r.oem_auto || '',
                makeAuto: r.make_auto || '',
                custodianAuto: r.custodian_auto || '',
                qty: r.qty,
                unit: r.unit || 'Nos',
                rate: Number(r.rate || 0),
                amount: Number(r.amount || 0),
                requireDate: r.require_date || '',
                sentToStore: r.sent_to_store || '',
                status: r.status || 'In Workshop',
                remarks: r.remarks || '',
                actualProblem: r.actual_problem || null,
                partsReplaced: r.parts_replaced || null,
                receivedDate: r.received_date || null,
                lastEdited: r.last_edited || null
            };
        }

        function amcJobToPayload(j) {
            return {
                id: j.id,
                machine_id: j.machineId,
                technician: j.technician,
                job_date: j.date,
                work_done: j.workDone
            };
        }

        function payloadToAmcJob(r) {
            return {
                id: r.id,
                machineId: r.machine_id,
                technician: r.technician,
                date: r.job_date,
                workDone: r.work_done
            };
        }

        async function loadStateFromSupabase() {
            const sb = getSb();
            if (!sb) return false;
            try {
                const [mRes, rRes, aRes] = await Promise.all([
                    sb.from('mm_machines').select('*').order('id'),
                    sb.from('mm_repairs').select('*').order('sent_to_store', { ascending: false }).limit(5000),
                    sb.from('mm_amc_jobs').select('*').order('job_date', { ascending: false }).limit(5000)
                ]);

                const machines = throwIfSbError(mRes, 'Load machines') || [];
                const repairs = throwIfSbError(rRes, 'Load repairs') || [];
                const amcJobs = throwIfSbError(aRes, 'Load AMC jobs') || [];

                state.machines = machines.map(payloadToMachine);
                state.repairs = repairs.map(payloadToRepair);
                state.amcJobs = amcJobs.map(payloadToAmcJob);
                return true;
            } catch (e) {
                notifySbError('Supabase load failed', e);
                return false;
            }
        }

        async function upsertMachine(m) {
            const sb = getSb();
            if (!sb) return;
            const res = await sb.from('mm_machines').upsert(machineToPayload(m), { onConflict: 'id' });
            throwIfSbError(res, 'Save machine');
        }

        async function upsertRepair(r) {
            const sb = getSb();
            if (!sb) return;
            const res = await sb.from('mm_repairs').upsert(repairToPayload(r), { onConflict: 'id' });
            throwIfSbError(res, 'Save repair');
        }

        async function upsertAmcJob(j) {
            const sb = getSb();
            if (!sb) return;
            const res = await sb.from('mm_amc_jobs').upsert(amcJobToPayload(j), { onConflict: 'id' });
            throwIfSbError(res, 'Save AMC job');
        }

        function calculateLifeValue(issueDate, endDateStr, mode) {
            if (!issueDate) return "N/A";
            const start = new Date(issueDate);
            const end = endDateStr ? new Date(endDateStr) : new Date();
            const diffTime = Math.abs(end - start);
            if (mode === 'days') return `${Math.ceil(diffTime / (1000 * 60 * 60 * 24)).toLocaleString()} Days`;
            if (mode === 'years') return `${(diffTime / (1000 * 60 * 60 * 24 * 365.25)).toFixed(1)} Years`;
            const years = end.getFullYear() - start.getFullYear();
            const months = end.getMonth() - start.getMonth();
            return `${(years * 12) + months} Months`;
        }

        function cycleLifeMode(id) {
            const modes = ['months', 'days', 'years'];
            state.lifeDisplayMode = modes[(modes.indexOf(state.lifeDisplayMode) + 1) % modes.length];
            renderDeepDive(id);
        }

        // --- View Logic ---
        function switchView(viewId) {
            state.currentView = viewId;
            state.activeAuditId = null;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bg-slate-800', 'text-white'));
            const activeBtn = document.getElementById(`nav-${viewId}`);
            if (activeBtn) activeBtn.classList.add('bg-slate-800', 'text-white');
            document.querySelectorAll('.bottom-nav-btn').forEach(btn => btn.classList.remove('text-blue-600'));
            const mobileBtn = document.getElementById(`mobile-nav-${viewId}`);
            if (mobileBtn) mobileBtn.classList.add('text-blue-600');
            document.getElementById('current-view-title').textContent = viewId.toUpperCase();
            render();
        }

        function render() {
            const container = document.getElementById('content-area');
            const activeMachines = state.machines.filter(m => m.status === 'Active');
            const scrappedMachines = state.machines.filter(m => m.status === 'Scrapped');
            const underRepair = state.repairs.filter(r => r.status === 'In Workshop');
            const amcDue = activeMachines.filter(m => isAmcExpired(m.amcExpiry) || isAmcSoon(m.amcExpiry));

            if (amcDue.length > 0) document.getElementById('amc-alert-dot').classList.remove('hidden');
            else document.getElementById('amc-alert-dot').classList.add('hidden');

            switch (state.currentView) {
                case 'dashboard': 
                    container.innerHTML = renderDashboard(activeMachines.length, underRepair.length, amcDue.length, scrappedMachines.length); 
                    initRepairTrendChart();
                    break;
                case 'machines': container.innerHTML = renderMachineList(activeMachines); break;
                case 'repairs': container.innerHTML = renderRepairLogs(activeMachines); break;
                case 'scrap': container.innerHTML = renderScrapHistory(scrappedMachines); break;
                case 'amc': container.innerHTML = renderAmcTracking(activeMachines); break;
            }
            if (window.lucide) window.lucide.createIcons();
        }

        function renderStatCard(label, val, color, icon) {
            return `<div class="bg-white p-6 rounded-xl border flex items-center space-x-4 border-l-4 border-l-${color}-500 shadow-sm"><div class="p-3 bg-${color}-100 text-${color}-600 rounded-lg"><i data-lucide="${icon}" class="w-5 h-5"></i></div><div><p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">${label}</p><p class="text-2xl font-black">${val}</p></div></div>`;
        }

        function renderDashboard(active, repairs, amc, scrapped) {
            return `<div class="space-y-6"><div class="grid grid-cols-1 md:grid-cols-4 gap-4">${renderStatCard('Active', active, 'blue', 'hard-drive')}${renderStatCard('In Repair', repairs, 'orange', 'wrench')}${renderStatCard('AMC Alert', amc, 'red', 'bell')}${renderStatCard('Scrapped', scrapped, 'slate', 'archive')}</div><div class="grid grid-cols-1 lg:grid-cols-3 gap-6"><div class="lg:col-span-2 bg-white p-6 rounded-2xl border"><div class="flex justify-between mb-6"><h3 class="font-bold text-xs flex items-center gap-2"><i data-lucide="trending-up" class="w-4 h-4 text-blue-500"></i> Repair % Trend</h3><span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded">LAST 6 MONTHS</span></div><div class="h-[280px]"><canvas id="repairTrendChart"></canvas></div></div><div class="space-y-4"><div class="bg-white p-6 rounded-2xl border"><h3 class="font-bold text-xs mb-4">System Status</h3><div class="space-y-4"><div class="flex justify-between p-3 bg-blue-50 rounded-lg"><div class="flex gap-3"><div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div><span class="text-xs font-bold text-blue-700">Operational</span></div><span class="text-xs font-black">${Math.round((active/(active+repairs+0.001))*100)}%</span></div><div class="flex justify-between p-3 bg-orange-50 rounded-lg"><div><div class="w-2 h-2 rounded-full bg-orange-500 inline-block mr-2"></div><span class="text-xs font-bold text-orange-700">Downtime</span></div><span class="text-xs font-black">${Math.round((repairs/(active+repairs+0.001))*100)}%</span></div></div></div><div class="bg-slate-900 p-6 rounded-2xl"><h3 class="text-white font-bold text-[10px] opacity-60">Maintenance Protocol</h3><p class="text-slate-300 text-xs">All breakdown entries generate QR-coded Machine Repair Notes.</p></div></div></div></div>`;
        }

        function initRepairTrendChart() {
            const ctx = document.getElementById('repairTrendChart');
            if (!ctx) return;
            const labels = [], data = [];
            const activeCount = state.machines.filter(m => m.status === 'Active').length || 1;
            for (let i = 5; i >= 0; i--) {
                const d = new Date();
                d.setMonth(d.getMonth() - i);
                labels.push(d.toLocaleString('default', { month: 'short' }));
                const monthRepairs = state.repairs.filter(r => { const rd = new Date(r.sentToStore); return rd.getMonth() === d.getMonth() && rd.getFullYear() === d.getFullYear(); }).length;
                data.push((monthRepairs / activeCount) * 100);
            }
            new Chart(ctx, { type: 'line', data: { labels, datasets: [{ label: 'Repair %', data, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', fill: true, tension: 0.4, borderWidth: 3, pointRadius: 4, pointBackgroundColor: '#fff', pointBorderColor: '#3b82f6' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } }, x: { grid: { display: false } } } } });
        }

        function renderMachineList(machines) {
            return `<div class="space-y-4"><div class="flex justify-between bg-white p-4 rounded-xl border"><div class="relative"><i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4"></i><input type="text" placeholder="Filter..." class="pl-10 pr-4 py-2 bg-slate-50 border rounded"></div><button onclick="openAddModal()" class="bg-blue-600 text-white px-6 py-2 rounded flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i>New Machine</button></div><div class="bg-white rounded-xl border overflow-hidden"><table class="w-full"><thead class="bg-slate-50 text-[10px] uppercase font-bold"><tr><th class="px-6 py-4">Machine Name</th><th class="px-6 py-4">SR No</th><th class="px-6 py-4">Custodian</th><th class="px-6 py-4 text-center">Actions</th></tr></thead><tbody>${machines.map(m => `<tr><td class="px-6 py-4 font-bold">${m.name}<br><span class="text-xs text-slate-400">${m.make} ${m.model}</span></td><td class="px-6 py-4 font-mono text-xs">${m.srNo}</td><td class="px-6 py-4">${m.custodian}</td><td class="px-6 py-4 text-center"><div class="flex justify-center gap-2"><button onclick="openEditMachineModal('${m.id}')"><i data-lucide="edit-2" class="w-4 h-4"></i></button><button onclick="renderDeepDive('${m.id}')"><i data-lucide="eye" class="w-4 h-4"></i></button><button onclick="openScrapModal('${m.id}')"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></td></tr>`).join('')}</tbody></table></div></div>`;
        }

        function fillRepairFormFromMachine(machineId) {
            const m = getMachine(machineId);
            if (!m) return false;
            const selectEl = document.getElementById('r-machine-id');
            if (selectEl) {
                selectEl.value = machineId;
                if (typeof autoFillMachineDetails === 'function') autoFillMachineDetails();
            }
            return true;
        }

        // QR Scanner for Repair Log (fixed camera)
        function openRepairScannerModal() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                    <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                        <span class="font-bold flex gap-2"><i data-lucide="scan-line" class="w-5 h-5"></i> Scan Machine QR Code</span>
                        <button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="p-4">
                        <div id="repair-qr-reader" style="width:100%; min-height:300px;"></div>
                        <div id="repair-qr-error" class="text-red-600 text-xs text-center mt-3 hidden"></div>
                        <div class="mt-4 text-center text-xs text-slate-400">Position the machine QR code inside the frame.<br>Make sure to allow camera access.</div>
                        <div class="mt-3 flex justify-center gap-3">
                            <button onclick="closeModal()" class="bg-slate-200 px-4 py-2 rounded text-sm">Cancel</button>
                            <button onclick="manualMachineEntry()" class="bg-blue-100 text-blue-700 px-4 py-2 rounded text-sm">Enter Machine ID manually</button>
                        </div>
                    </div>
                </div>`;
            modal.classList.remove('hidden');
            if (window.lucide) window.lucide.createIcons();

            setTimeout(() => {
                const qrContainer = document.getElementById('repair-qr-reader');
                if (!qrContainer) return;
                if (repairScanner && repairScanner.isScanning) {
                    repairScanner.stop().catch(e => console.warn);
                }
                repairScanner = new Html5Qrcode("repair-qr-reader");
                const config = { fps: 10, qrbox: { width: 250, height: 250 } };
                repairScanner.start({ facingMode: "environment" }, config, (decodedText) => {
                    if (repairScanner) repairScanner.stop().catch(e=>console.warn);
                    closeModal();
                    let machineId = null;
                    const midMatch = decodedText.match(/MID:(\S+)/);
                    if (midMatch && midMatch[1]) machineId = midMatch[1];
                    else {
                        const repairMatch = decodedText.match(/MR:(\S+)/);
                        if (repairMatch && repairMatch[1]) {
                            const rep = getRepair(repairMatch[1]);
                            if (rep) machineId = rep.machineId;
                        }
                    }
                    if (machineId && getMachine(machineId)) {
                        fillRepairFormFromMachine(machineId);
                        alert("Machine details filled successfully!");
                    } else {
                        alert("QR code does not contain a valid machine ID.");
                    }
                }, (err) => {
                    console.log("Scan error", err);
                    const errorDiv = document.getElementById('repair-qr-error');
                    if (errorDiv && !errorDiv.classList.contains('hidden')) return;
                    setTimeout(() => {
                        if (document.getElementById('repair-qr-error')) {
                            document.getElementById('repair-qr-error').innerText = "Camera not working? Try manual entry below.";
                            document.getElementById('repair-qr-error').classList.remove('hidden');
                        }
                    }, 5000);
                }).catch((err) => {
                    console.error("Camera start error", err);
                    const errorDiv = document.getElementById('repair-qr-error');
                    if (errorDiv) {
                        errorDiv.innerText = "Camera access denied or not supported. Please use manual entry.";
                        errorDiv.classList.remove('hidden');
                    }
                });
            }, 100);
        }

        function manualMachineEntry() {
            closeModal();
            const machineId = prompt("Enter Machine ID (e.g., M1234567890):");
            if (machineId && getMachine(machineId)) {
                fillRepairFormFromMachine(machineId);
                alert("Machine details filled!");
            } else if (machineId) {
                alert("Machine ID not found.");
            }
        }

        function renderAmcTracking(machines) {

        async function handleLogRepair(e) {
            e.preventDefault();
            const m = getMachine(document.getElementById('r-machine-id').value);
            const repairId = (document.getElementById('r-type').value === 'Outsourced' ? 'PR-' : 'MR-') + Date.now().toString().slice(-6);
            const r = { id: repairId, machineId: m.id, repairType: document.getElementById('r-type').value, problem: document.getElementById('r-problem').value, initiatorName: document.getElementById('r-init-name').value, probReportBy: document.getElementById('r-report-by').value, checkedBy: document.getElementById('r-checked-by').value, srNoAuto: m.srNo, oemAuto: m.oemSrNo, makeAuto: m.make, custodianAuto: m.custodian, qty: 1, unit: 'Nos', rate: parseFloat(document.getElementById('r-rate').value) || 0, amount: parseFloat(document.getElementById('r-rate').value) || 0, requireDate: document.getElementById('r-req-date').value, sentToStore: new Date().toISOString().split('T')[0], status: 'In Workshop', remarks: document.getElementById('r-remarks').value, lastEdited: null };
            state.repairs.push(r);

            if (sb) { try { await upsertRepair(r); } catch (err) { notifySbError('Repair save failed', err); } }

        async function handleLogAmcJob(e) {
            e.preventDefault();
            const mId = document.getElementById('amc-machine-id').value;
            const j = { id: 'J' + Date.now(), machineId: mId, technician: document.getElementById('amc-tech').value, date: document.getElementById('amc-date').value, workDone: document.getElementById('amc-work').value };

        function printFormalNote(repairId) {

            const reqLabel = isOut ? 'Requisition No' : 'Repair Note Number';
            let tableHtml = isOut ? `<thead><tr><th>Sr</th><th>Machine Name</th><th>Problem</th><th>Make</th><th>SR No</th><th>Qty</th><th>Unit</th><th>Rate</th><th>Amount</th><th>Req.Date</th></tr></thead><tbody><tr><td>1</td><td>${m.name}</td><td>${r.problem}</td><td>${r.makeAuto}</td><td>${r.srNoAuto}</td><td>1</td><td>Nos</td><td>${r.rate}</td><td>${r.amount}</td><td>${r.requireDate}</td></tr></tbody>` : `<thead><tr><th>Sr</th><th>Internal SR</th><th>Machine</th><th>Make</th><th>OEM SR</th><th>Qty</th><th>Unit</th><th>Initiator</th><th>Reported By</th><th>Req.Date</th><th>Remarks</th></tr></thead><tbody><tr><td>1</td><td>${r.srNoAuto}</td><td>${m.name}</td><td>${r.makeAuto}</td><td>${r.oemAuto}</td><td>1</td><td>Nos</td><td>${r.initiatorName}</td><td>${r.probReportBy}</td><td>${r.requireDate}</td><td>${r.remarks||'-'}</td></tr></tbody>`;

            new QRCode(document.getElementById("qr-code-placeholder"), { text: `MID:${m.id}\nMR:${r.id}\nMachine:${m.name}\nSR:${r.srNoAuto}`, width: 60, height: 60, correctLevel: QRCode.CorrectLevel.H });

        function renderDeepDive(id) {

            const aHistory = state.amcJobs.filter(j => j.machineId === id);
            const lifeString = calculateLifeValue(m.issueDate, m.status === 'Scrapped' ? m.scrapDate : null, state.lifeDisplayMode);
            document.getElementById('content-area').innerHTML = `<div class="space-y-6"><button onclick="switchView('${m.status === 'Active' ? 'machines' : 'scrap'}')" class="flex items-center gap-2 text-slate-500"><i data-lucide="arrow-left" class="w-4 h-4"></i>Back</button><div class="grid grid-cols-1 lg:grid-cols-3 gap-6"><div class="lg:col-span-1 bg-white rounded-2xl border"><div class="bg-slate-900 p-6 text-white font-bold text-xl">${m.name}</div><div class="p-6 space-y-4"><div onclick="cycleLifeMode('${m.id}')" class="bg-blue-600 p-4 rounded-xl text-center text-white cursor-pointer"><p class="text-[9px] font-bold uppercase">Actual Life</p><p class="text-2xl font-black">${lifeString}</p><p class="text-[10px]">tap to change mode</p></div><div class="grid grid-cols-2 gap-4"><div><p class="text-[9px] font-bold">Make/Model</p><p>${m.make} ${m.model}</p></div><div><p class="text-[9px] font-bold">Custodian</p><p>${m.custodian}</p></div><div><p class="text-[9px] font-bold">SR No</p><p class="font-mono">${m.srNo}</p></div><div><p class="text-[9px] font-bold">Entry Date</p><p>${m.issueDate}</p></div></div>${m.status==='Scrapped'?`<div class="bg-red-50 p-4 rounded"><p class="font-bold text-red-700">Scrapped: ${m.scrapDate}</p><p>Authority: ${m.approvedBy}</p><p class="italic">${m.scrapReason}</p></div>`:''}</div></div><div class="lg:col-span-2 space-y-6"><div class="bg-white rounded-xl border h-[400px] overflow-auto"><div class="p-4 bg-slate-50 font-bold text-[10px]">Breakdown History</div><div class="divide-y">${rHistory.map(r=>`<div class="p-4"><div class="flex justify-between"><b>${r.problem}</b><span class="text-[10px] ${r.status==='Completed'?'text-green-600':'text-orange-600'}">${r.status}</span></div><p class="text-[10px] text-slate-500">Sent: ${r.sentToStore} • Received: ${r.receivedDate||'N/A'}</p>${r.actualProblem?`<p class="text-[10px] text-blue-600 bg-blue-50 p-2 rounded">${r.actualProblem}</p>`:''}</div>`).join('')||'<p class="p-10 text-center text-slate-300         }
